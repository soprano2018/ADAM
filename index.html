<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ADAM Agenda</title>
<style>
:root{
  --gold:#c9a15e;--on-gold:#1b140a;--ga:.55;
  --gold-lt:color-mix(in srgb,var(--gold) 70%,#fff);
  --gold-a:color-mix(in srgb,var(--gold) 18%,transparent);
  --gold-b:color-mix(in srgb,var(--gold) 34%,transparent);
  --glass:rgba(16,26,42,var(--ga));--glass-top:rgba(10,17,29,calc(var(--ga) + .18));--glass2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.20);
  --text:#eef2f7;--muted:rgba(238,242,247,.68);--faint:rgba(238,242,247,.42);
  --ok:#3fb878;--err:#e05656;--now:#e05656;
  --hh:56px;--card:84px;--toph:60px;
  --bgT:url("img/bg-tablet.jpg");--bgP:url("img/bg-phone.jpg");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1220;color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg.i{width:20px;height:20px;flex:none}
.hide{display:none!important}
/* ADAM scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--gold-b) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold-b);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--gold) 60%,transparent);background-clip:padding-box}

/* background picture under everything (also under the iPhone home bar) */
#bg{position:fixed;left:0;top:0;width:100%;height:100lvh;min-height:100%;background:#0b1220 var(--bgT) center/cover no-repeat;z-index:0}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,16,.25),rgba(5,9,16,.45))}

/* ---------- shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.top{position:relative;z-index:6;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--glass-top);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);min-height:var(--toph)}
.logo{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:4px 8px 4px 4px;border-radius:12px;flex:none;position:relative}
.logo img{width:34px;height:34px;border-radius:9px;display:block}
.logo:active{background:var(--glass2)}
.logo .dot{position:absolute;left:30px;top:2px;border:2px solid #0b1220}
.brand{font-weight:800;letter-spacing:.14em;font-size:14px;white-space:nowrap}
.brand b{color:var(--gold);font-weight:800}
.tz{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ttl{font-size:16px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);display:grid;place-items:center;flex:none;color:var(--text)}
.ib.on{border-color:var(--gold);color:var(--gold-lt);background:var(--gold-a)}
.ib:active,.btn:active{transform:scale(.97)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden;flex:none;background:var(--glass2)}
.seg button{min-height:40px;min-width:44px;padding:0 10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--gold-a);color:var(--gold-lt)}
.dot{width:10px;height:10px;border-radius:50%;background:#6d7f8f;flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.run{background:var(--gold);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.body{flex:1;min-height:0;position:relative;z-index:1}

/* alphabet row (companies) */
.abc{display:flex;gap:3px;flex:1;min-width:0}
.abc button{flex:1 1 0;min-width:0;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--glass2);color:var(--muted);font-weight:700;font-size:13px;padding:0}
.abc button.on{border-color:var(--gold);color:var(--on-gold);background:var(--gold)}
.abc button.num{flex:1.6 1 0}
.abc-ph{display:none}

/* ---------- side bar (tablet) ---------- */
.side-ov{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.18)}
.side{position:fixed;left:0;top:var(--toph);bottom:0;width:270px;z-index:5;display:flex;flex-direction:column;background:var(--glass-top);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;padding:12px 10px calc(12px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));box-shadow:20px 0 50px rgba(0,0,0,.35)}
.side.open{transform:none}
.sd-nav{display:flex;flex-direction:column;gap:4px}
.sd-it{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border-radius:13px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:650;font-size:15.5px;text-align:left;width:100%}
.sd-it svg{width:23px;height:23px;color:var(--gold-lt)}
.sd-it.on{background:var(--gold-a);border-color:var(--gold-b);color:var(--text)}
.sd-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 22px;padding-left:12px;border-left:1px solid var(--line2)}
.sd-sub .sd-it{min-height:42px;font-size:14px}
.sd-sub .sd-it svg{width:19px;height:19px}
.sd-sub .sd-it.on{background:transparent;border-color:transparent;color:var(--gold-lt)}
.sd-user{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.sd-user .tx{flex:1;min-width:0}
.sd-user b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.sd-user small{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bottom bar (phone) ---------- */
.tabbar{display:none;position:relative;z-index:6;border-top:1px solid var(--line);background:var(--glass-top);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;min-height:52px;justify-content:center;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--gold-lt)}
.tb-pop{position:fixed;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:var(--glass-top);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.45);min-width:210px}

/* ---------- search ---------- */
.srch{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:rgba(6,11,20,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.srch-h{display:flex;gap:8px;padding:12px;background:var(--glass-top);border-bottom:1px solid var(--line)}
.srch-h .inp{flex:1;min-height:46px}
.srch-b{flex:1;overflow-y:auto;padding:10px 14px 90px;-webkit-overflow-scrolling:touch}
.srch-n{font-size:12px;color:var(--faint);margin:2px 2px 10px}
mark{background:var(--gold-b);color:inherit;border-radius:3px;padding:0 1px}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.07);outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:90px;resize:vertical}
select.inp option{background:#16202f}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--glass2);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn-red{border-color:rgba(224,86,86,.5);color:#f3a0a0}
.btn[disabled]{opacity:.45;pointer-events:none}
.msg{min-height:20px;font-size:13px;color:#f3a0a0;margin-top:6px}

/* ---------- calendar: hour rows that grow to fit the cards ---------- */
.tg{position:absolute;inset:0;display:flex;flex-direction:column}
.tg-h{display:grid;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tg-h .c{padding:7px 6px;text-align:center;font-size:12px;color:var(--muted);border-left:1px solid var(--line);cursor:pointer}
.tg-h .c b{display:block;font-size:20px;color:var(--text);font-weight:700}
.tg-h .c.today b{color:var(--gold-lt)}
.tg-s{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tg-r{display:grid;border-bottom:1px solid var(--line);min-height:var(--hh)}
.tg-r.ad{background:rgba(255,255,255,.03);border-bottom:1px solid var(--line2)}
.tg-hr{font-size:11px;color:var(--faint);text-align:right;padding:4px 6px 0 0}
.tg-c{border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:4px;position:relative;cursor:pointer;min-width:0}
.tg-c.today{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
/* cards mode: one column per day, cards stacked by time */
.cs{display:grid;min-height:100%}
.cs-c{border-left:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;min-height:100%}
.cs-c.today{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.cs-c .empty{padding:24px 6px;font-size:13px}
.cs1 .cs-c{max-width:760px;margin:0 auto;width:100%;border-left:0;padding:12px 14px 90px;gap:8px}

.card{min-height:var(--card);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.3;border:1px solid rgba(255,255,255,.14);background:color-mix(in srgb,var(--c) 30%,rgba(16,26,42,.85));border-left:5px solid var(--c);cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
body.mono .card,body.mono .ls-it{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .t{display:flex;align-items:flex-start;gap:6px;font-weight:700;font-size:13.5px}
.card .t svg{width:16px;height:16px;margin-top:1px;color:var(--gold-lt)}
body:not(.mono) .card .t svg{color:inherit}
.card .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .m{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .m i{font-style:normal;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.25)}
.card.arch{opacity:.45}.card.arch .t span{text-decoration:line-through}
.card.ad{min-height:48px;flex-direction:row;align-items:center}
.pr3{box-shadow:inset 0 0 0 1px rgba(224,86,86,.6)}

/* month */
.mo{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mo-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:11.5px;color:var(--muted);text-align:center;padding:7px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--glass-top);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:2}
.mo-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(120px,auto)}
.mo-d{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.mo-d .n{font-size:13px;font-weight:650;color:var(--muted);width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.mo-d.out{opacity:.4}
.mo-d.today .n{background:var(--gold);color:var(--on-gold)}
.mo-d .card{min-height:56px;padding:6px 8px}
.mo-d .card .t{font-size:12.5px}

/* list rows (search, linked activities) */
.ls-it{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);margin-bottom:8px;border-left:5px solid var(--c);cursor:pointer;min-height:var(--card)}
.ls-it .tm{width:110px;flex:none;font-size:13px;color:var(--muted)}
.ls-it .tx{flex:1;min-width:0}
.ls-it .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-it .tx small{color:var(--faint)}
.ls-it svg{color:var(--gold-lt)}
.ls-it.arch{opacity:.5}
.empty{color:var(--faint);text-align:center;padding:60px 20px}
.nocon{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.nocon>div{max-width:440px;text-align:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:28px}
.nocon p{color:var(--muted);margin:10px 0 18px}

/* ---------- companies ---------- */
.co{position:absolute;inset:0;display:grid;grid-template-columns:minmax(300px,380px) 1fr}
.co-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.co-s{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.co-s small{color:var(--faint);font-size:12px}
.qbox{position:relative}
.qbox .inp{padding-right:48px}
.qbox .x{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center}
.co-ls{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.co-it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.co-it.on{background:var(--gold-a)}
.co-it .tx{flex:1;min-width:0}
.co-it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.co-it small{color:var(--muted);font-size:12.5px}
.co-it .ad2{display:none}
.av{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--on-gold);background:linear-gradient(160deg,var(--gold-lt),var(--gold));overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.p{border-radius:50%;background:linear-gradient(160deg,#9fb6d6,#56708f);color:#0c131e}
.co-d{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 22px 60px;min-width:0}
.co-hd{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.co-hd .av{width:64px;height:64px;font-size:22px;border-radius:16px}
.co-hd h2{margin:0;font-size:22px;line-height:1.2}
.co-hd small{color:var(--muted)}
.box{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px}
.kv span{color:var(--faint)}
.ct{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line);text-decoration:none}
.ct:last-child{border-bottom:0}
.ct .v{flex:1;min-width:0;word-break:break-word}
.ct small{color:var(--faint);font-size:12px;display:block}
.ct svg{color:var(--gold-lt)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pc{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px}
.pc-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.pc-h b{display:block;font-size:15px}
.pc-h small{color:var(--muted);font-size:12.5px}
.co-back{display:none}

/* ---------- settings ---------- */
.set{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 100px}
.set-w{max-width:720px;margin:0 auto}
.set .box{padding:18px 18px 8px;margin-bottom:16px}
.set .box h3{font-size:12px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.set .box h3 svg{width:18px;height:18px;color:var(--gold-lt)}
.srow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.srow:first-of-type{border-top:0}
.srow>label,.srow>.lb{flex:1;min-width:180px;font-size:14.5px}
.srow small{display:block;color:var(--faint);font-size:12px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line2);background:var(--glass2);color:var(--muted);font-size:14px;font-weight:600}
.pill.on{border-color:var(--gold);color:var(--gold-lt);background:var(--gold-a)}
.sws{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c);padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.swp{width:40px;height:34px;border:1px solid var(--line2);border-radius:10px;background:transparent;padding:2px}
input[type=range]{width:220px;accent-color:var(--gold)}
.tg2{width:22px;height:22px;accent-color:var(--gold)}
.bgp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bgp .pv{width:120px;height:76px;border-radius:10px;border:1px solid var(--line2);background:#0b1220 center/cover no-repeat}
.bgp .pv.ph{width:46px;height:92px}
.conn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--glass2);border:1px solid var(--line);margin-bottom:14px;font-size:14px}
.conn .tx{flex:1;min-width:0;word-break:break-word}
.conn small{display:block;color:var(--faint)}
details.dg summary{cursor:pointer;color:var(--muted);font-size:13.5px;min-height:40px;display:flex;align-items:center}

/* ---------- log ---------- */
.lg{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 60px}
.lg-r{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--glass);overflow:hidden}
.lg-r summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;font-size:13.5px;list-style:none}
.lg-r summary::-webkit-details-marker{display:none}
.lg-r .p{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-r .s{font-weight:700;font-size:12px;padding:2px 8px;border-radius:7px;background:rgba(63,184,120,.18);color:#8fe0b4}
.lg-r.e .s{background:rgba(224,86,86,.2);color:#f3a0a0}
.lg-r .w{font-size:12px;color:var(--faint)}
pre.code{margin:0;padding:10px 12px;border-top:1px solid var(--line);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;color:var(--muted)}
pre.code b{color:var(--text)}

/* ---------- task sheet ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.sh{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:rgba(12,20,33,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.45);padding-top:env(safe-area-inset-top)}
.sh-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-h .ttl{flex:1}
.sh-b{flex:1;overflow-y:auto;padding:16px 18px 30px;-webkit-overflow-scrolling:touch}
.sh-f{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tgl{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.tgl input{width:22px;height:22px;accent-color:var(--gold)}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.sw0{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;color:var(--muted)}
.icons button.on{border-color:var(--gold);color:var(--gold-lt);background:var(--gold-a)}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.ck input.inp{min-height:40px;flex:1}
.ck .x{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--faint);font-size:20px}
.sec{margin:20px 0 8px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lnk{display:flex;gap:8px;margin-bottom:8px}
.lnk .inp{min-height:40px}
.ro{font-size:12.5px;color:var(--gold-lt);background:var(--gold-a);border:1px solid var(--gold-b);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:8px}
.cm{max-width:86%;padding:8px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:14px;white-space:pre-wrap;word-break:break-word}
.cm.me{align-self:flex-end;background:var(--gold-a);border-color:var(--gold-b)}
.cm small{display:block;color:var(--faint);font-size:11px;margin-bottom:2px}
.cin{display:flex;gap:8px;margin-top:10px}
.cin .inp{min-height:44px}
.files a{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

/* ---------- error dialog ---------- */
.er-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:20px}
.er{width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;background:#1a1416;border:1px solid rgba(224,86,86,.55);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.er-h{display:flex;gap:12px;align-items:center;padding:16px 18px;background:rgba(224,86,86,.14);border-bottom:1px solid rgba(224,86,86,.35)}
.er-h svg{width:28px;height:28px;color:#f3a0a0;flex:none}
.er-h b{font-size:17px;display:block}
.er-h small{color:var(--muted)}
.er-b{padding:14px 18px;overflow:auto}
.er-m{font-size:16px;font-weight:650;color:#ffd0d0;margin-bottom:12px;word-break:break-word}
.er-b pre{margin:0;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:300px;overflow:auto}
.er-f{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--glass-top);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.fab{position:absolute;right:calc(20px + env(safe-area-inset-right));bottom:20px;width:60px;height:60px;border-radius:50%;border:0;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:3}
.fab svg{width:28px;height:28px}

/* ---------- phone ---------- */
@media (max-width:700px){
  #bg{background-image:var(--bgP)}
  .top{padding:calc(6px + env(safe-area-inset-top)) 6px 6px;gap:4px}
  .tz{gap:4px}
  #tzCal .sp{display:none}
  #tzCal .ttl{flex:1}
  body:not(.vm) #tzCal .ttl{display:none}
  body:not(.vm) #bPrev{margin-left:auto}
  .top .brand{display:none}
  .logo{padding:2px}
  .logo .dot{left:26px}
  .ib{width:34px;height:36px;border-radius:10px}
  .seg button{min-width:32px;min-height:34px;padding:0 5px}
  .seg button svg{width:18px;height:18px}
  .btn.sm{min-height:36px;padding:0 8px;font-size:13.5px}
  .logo img{width:32px;height:32px}
  .ttl{font-size:14px}
  .side,.side-ov{display:none!important}
  .tabbar{display:flex}
  .row{grid-template-columns:1fr 1fr}
  .ls-it .tm{width:78px}
  .kv{grid-template-columns:100px 1fr}
  .abc-top{display:none!important}
  .abc-ph{display:flex;flex:none;width:100%;overflow-x:auto;gap:4px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .abc-ph button{flex:none;width:36px;height:36px}
  .abc-ph button.num{width:48px}
  .co{grid-template-columns:minmax(0,1fr)}
  .co-l,.co-s{min-width:0}
  .co.det .co-l{display:none}
  .co:not(.det) .co-d{display:none}
  .co-back{display:inline-flex;margin-bottom:12px}
  .co-ls{padding:10px 10px 30px}
  .co-it{flex-direction:column;text-align:center;gap:8px;padding:16px 12px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--glass)}
  .co-it .av{width:56px;height:56px;font-size:19px;border-radius:15px}
  .co-it .tx{width:100%}
  .co-it b{white-space:normal;font-size:16px}
  .co-it .ct2{display:none}
  .co-it .ad2{display:block;margin-top:3px}
  .co-hd{flex-direction:column;text-align:center;gap:10px}
  .co-hd .av{width:76px;height:76px}
  .co-d{padding:14px 12px 60px}
  .fab{bottom:16px;right:16px}
  .set{padding:14px 12px 60px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .co-ttl{display:block!important}
}
.co-ttl{display:none}
</style>
</head>

function logTaglia(s,n){ s=String(s==null?'':s); return s.length>n?s.slice(0,n)+'\n... ('+(s.length-n)+')':s; }
function logAdd(r){
  LOG.unshift(r); LOG=LOG.slice(0,120);
  try{ ls(K_LOG,JSON.stringify(LOG)); }catch(e){ LOG=LOG.slice(0,30); try{ ls(K_LOG,JSON.stringify(LOG)); }catch(x){} }

/* ---------- REST ---------- */
function tok(){ return ls(K_TOK)||''; }
function erBreve(m){
  m=String(m||'');
  var x=/^(Failed to (?:execute|prepare|bind)[^:]*):\s*([\s\S]*?)(?:,\s*code:|$)/.exec(m);
  if(x)return x[2].trim()||x[1];
  return m.length>300?m.slice(0,300)+'...':m;
}
async function api(path,body,noAuth){
  if(!apiUrl())throw {m:t('inserisciSrv'),path:path};
  var h={'Content-Type':'application/json'};
  if(!noAuth&&tok())h.Authorization='Bearer '+tok();
  var t0=Date.now(), reqTx=JSON.stringify(body==null?{}:body);
  var reqLog=reqTx; if(path.indexOf('authorization')>=0)reqLog=reqLog.replace(/("password"\s*:\s*)"(?:[^"\\]|\\.)*"/,'$1"***"');
  var rec={ts:oraOra(),path:path,req:logTaglia(reqLog,6000),st:0,ok:false,ms:0,resp:''};
  var r;
  try{ r=await fetch(apiUrl()+path,{method:'POST',headers:h,body:reqTx}); }
  catch(e){ rec.ms=Date.now()-t0; rec.resp='Rete: '+(e&&e.message||e); logAdd(rec); throw {rete:true,m:'Server non raggiungibile',full:rec.resp,path:path}; }
  var txt=await r.text(), j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
  rec.st=r.status; rec.ms=Date.now()-t0; rec.ok=r.ok; rec.resp=logTaglia(txt,r.ok?3000:20000);
  if(r.ok){ rec.n=Array.isArray(j)?j.length:null; logAdd(rec); return j; }
  logAdd(rec);
  var c=j&&typeof j.code==='number'?j.code:-1, full=(j&&j.message)?String(j.message):('HTTP '+r.status+' '+txt.slice(0,500));
  var e2={st:r.status,code:c,auth:r.status===401||c===4,m:erBreve(full),full:full,path:path,req:reqLog};
  if(c===2)e2.m='Password errata'; else if(c===1&&r.status!==401)e2.m='Utente inesistente'; else if(e2.auth)e2.m=t('scaduto');
  else if(c===3)e2.m='Il record e usato da un altra tabella: '+full;
  throw e2;
}

function status(){

async function lavora(fn){ S.busy++; status(); try{ return await fn(); } finally{ S.busy--; status(); } }

function range(){
  var a,b;
  if(S.view==='g'){ a=day0(S.cur); b=addD(a,1); }
  else if(S.view==='s'){ a=monday(S.cur); b=addD(a,7); }
  else { var f=new Date(S.cur.getFullYear(),S.cur.getMonth(),1); a=monday(f); b=addD(a,42); }
  return {a:a,b:b};
}
async function carica(){
  if(!tok()){ disegna(); return; }
  if(S.page==='co'){ return caricaAziende(true); }
  if(S.page!=='cal'){ disegna(); return; }
  var r=range();
  await lavora(async function(){
    try{
      var body={from:ts(addD(r.a,-1)),to:ts(addD(r.b,1)),order:[{by:1,direction:0}]};
      if(!S.arch)body.archived=0;
      var l=await api('calendar/tasks/get',body);
      S.tasks=Array.isArray(l)?l:[]; S.err='';
      try{ ls(K_CACHE,JSON.stringify({k:iso(r.a)+S.view+S.arch,t:S.tasks})); }catch(x){}
    }catch(e){
      S.err=e.m||'Errore';
      if(e.auth){ esci(true); return; }
      try{ var c=JSON.parse(ls(K_CACHE)||'{}'); if(c.k===iso(r.a)+S.view+S.arch&&Array.isArray(c.t)){ S.tasks=c.t; } }catch(x){}
    }
  });
  disegna();
}

  o.description=o.description==null?'':String(o.description);

  o.checks=(o.checks||[]).filter(function(c){ return String(c.name||'').trim(); }).map(function(c){ var y={name:String(c.name).trim().slice(0,128),completed:!!c.completed}; if(c.id)y.id=c.id; return y; });
  o.links=(o.links||[]).filter(function(l){ return String(l.value||'').trim(); }).map(function(l){ var y={value:String(l.value),description:l.description?String(l.description).slice(0,128):null}; if(l.id)y.id=l.id; return y; });
  if(!Array.isArray(o.files))o.files=[];
  if(!Array.isArray(o.notification_times))o.notification_times=[];
  if(!o.id){ o.id=null; }
  return o;
}

/* a picture from the device becomes the background: resized and kept on this device only */
function caricaSfondo(file,k){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var max=k==='P'?1600:2200, s=Math.min(1,max/Math.max(im.width,im.height));
      var cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      var q=0.82, d=cv.toDataURL('image/jpeg',q);
      while(d.length>1500000&&q>0.4){ q-=0.12; d=cv.toDataURL('image/jpeg',q); }
      try{ ls(k==='T'?K_BGT:K_BGP,d); }catch(e){ toast(t('imgGrande')); return; }
      tema(); disegna();
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

  status(); pagina('set');
}
async function avvia(dopoLogin){
  S.me=+cfg().me||0;
  status();
  await utenti();
  pagina(dopoLogin?'cal':(cfg().page==='co'?'co':'cal'));
}
function lingua(l){ L=LANG[l]?l:'it'; cfgSet({lang:L}); document.documentElement.lang=L; nomiData(); }

/* ---------- events ---------- */
$('bLogo').onclick=function(){ if(isPhone())return; side(); };
$('sideOv').onclick=function(){ side(false); };
$('sdNav').onclick=function(e){
  var b=e.target.closest('button'); if(!b)return;
  if(b.id==='sdRef'){ carica(); return; }
  if(b.id==='sdArch'){ S.arch=!S.arch; disegnaSide(); carica(); return; }
  if(b.dataset.p)pagina(b.dataset.p);
};
$('tabbar').onclick=function(e){
  var b=e.target.closest('button'); if(!b)return;
  if(b.dataset.p==='cal'&&S.page==='cal'){ popCal(); return; }
  pagina(b.dataset.p);
};
$('bOggi').onclick=function(){ S.cur=day0(new Date()); carica(); };
var passo=function(n){
  if(S.view==='g')S.cur=addD(S.cur,n);
  else if(S.view==='s')S.cur=addD(S.cur,7*n);
  else S.cur=new Date(S.cur.getFullYear(),S.cur.getMonth()+n,1);
  carica();
};
$('bPrev').onclick=function(){ passo(-1); };
$('bNext').onclick=function(){ passo(1); };
$('bCerca').onclick=function(){ if(tok())cerca(); };
$('seg').onclick=function(e){ var b=e.target.closest('button'); if(!b)return; S.view=b.dataset.v; cfgSet({view:S.view}); carica(); };
$('mode').onclick=function(e){ var b=e.target.closest('button'); if(!b)return; S.mode=b.dataset.mo; cfgSet({mode:S.mode}); disegna(); };
$('top').addEventListener('click',function(e){ var a=e.target.closest('[data-abc]'); if(a)abc(a.dataset.abc); });
function abc(k){
  if(k==='#')S.coQ=S.coQ==='#'?'':'#';
  else S.coQ=(S.coQ==='#'?'':S.coQ)+k.toLowerCase();
  coRidisegna(false);
}
$('body').addEventListener('click',function(e){
  var go=e.target.closest('[data-go]'); if(go){ pagina(go.dataset.go); return; }
  if(S.page==='log'){
    if(e.target.closest('#lgSvuota')){ LOG=[]; ls(K_LOG,null); disegna(); }
    if(e.target.closest('#lgCopia'))copiaTx(registroTesto());
    return;
  }
  if(S.page==='set'){
    var l=e.target.closest('[data-lang]'); if(l){ lingua(l.dataset.lang); topBar(); tabBar(); disegna(); return; }
    var a=e.target.closest('[data-acc]'); if(a){ cfgSet({acc:a.dataset.acc}); tema(); disegna(); return; }
    var br=e.target.closest('[data-bgr]'); if(br){ ls(br.dataset.bgr==='T'?K_BGT:K_BGP,null); tema(); disegna(); return; }
    return;
  }
  if(e.target.closest('#sClose')){ cerca(false); return; }
  if(e.target.closest('#sX')){ S.sQ=''; var si=$('sQ'); if(si){ si.value=''; si.focus(); } risultati(); return; }
  if(S.page==='co'){
    var ab=e.target.closest('[data-abc]'); if(ab){ abc(ab.dataset.abc); return; }
    if(e.target.closest('#coX')){ S.coQ=''; coRidisegna(false); return; }
    var it=e.target.closest('[data-co]'); if(it){ S.coSel=+it.dataset.co; S.coTasks=null; coRidisegna(true); coAttivita(S.coSel); var d=$('body').querySelector('.co-d'); if(d)d.scrollTop=0; return; }
    if(e.target.closest('#coBack')){ S.coSel=0; coRidisegna(true); return; }
    var tk=e.target.closest('[data-id]'); if(tk){ apri(tk.dataset.id); }
    return;
  }
  var x=e.target.closest('[data-id]'); if(x){ apri(x.dataset.id); return; }
  if(e.target.closest('#srch'))return;
  var md=e.target.closest('[data-day]'); if(md){ S.cur=new Date(md.dataset.day+'T00:00:00'); S.view='g'; cfgSet({view:'g'}); carica(); return; }
  var hd=e.target.closest('.tg-h .c[data-d]'); if(hd){ S.cur=new Date(hd.dataset.d+'T00:00:00'); S.view='g'; cfgSet({view:'g'}); carica(); return; }
  var c=e.target.closest('.tg-c,.cs-c'); if(c){ var h=c.dataset.h; apri(null,c.dataset.d,(h==='ad'||h==='col')?null:P2(+h)+':00'); if(h==='ad'){ $('fAD').checked=true; $('fAD').onchange(); } }
});
$('body').addEventListener('change',function(e){ var f=e.target.closest('[data-bg]'); if(f){ caricaSfondo(f.files&&f.files[0],f.dataset.bg); f.value=''; } });
var sT=0;
$('body').addEventListener('input',function(e){
  if(e.target.id==='sQ'){ S.sQ=e.target.value; clearTimeout(sT); sT=setTimeout(risultati,200); return; }
  if(e.target.id!=='coQ')return;
  S.coQ=e.target.value; var pos=e.target.selectionStart;
  coRidisegna(false); var q=$('coQ'); if(q){ q.focus(); try{ q.setSelectionRange(pos,pos); }catch(x){} }
});
/* swipe left / right to change the period */
(function(){ var x0=null,y0=0; var b=$('body');
  b.addEventListener('touchstart',function(e){ if(e.touches.length!==1||S.page!=='cal'||S.srch)return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  b.addEventListener('touchend',function(e){ if(x0==null)return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.6)passo(dx<0?1:-1); },{passive:true});
})();
document.addEventListener('click',function(e){ if(S.pop&&!e.target.closest('#tbPop')&&!e.target.closest('#tabbar'))popCal(false); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&tok()&&!S.edit&&S.page==='cal'&&!S.srch)carica(); });
setInterval(function(){ if(tok()&&!S.edit&&!document.hidden&&S.page==='cal'&&!S.srch&&!$('erOv'))carica(); },60000);
window.addEventListener('online',function(){ if(tok()&&S.page==='cal')carica(); });
var rzT=0, wasPh=isPhone();
window.addEventListener('resize',function(){ clearTimeout(rzT); rzT=setTimeout(function(){ var p=isPhone(); if(p!==wasPh){ wasPh=p; side(false); popCal(false); } topBar(); if(S.page!=='set')disegna(); },150); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var o=$('erOv'); if(o){ o.remove(); return; } if(S.edit){ chiudi(); return; } if(S.srch){ cerca(false); return; } if(S.side)side(false); } });

/* ---------- start ---------- */
(function(){
  var c=cfg();
  lingua(c.lang||((navigator.language||'it').slice(0,2)==='ru'?'ru':'it'));
  S.view=['g','s','m'].indexOf(c.view)>=0?c.view:(isPhone()?'g':'s');
  S.mode=c.mode==='carte'||c.mode==='ore'?c.mode:(isPhone()?'carte':'ore');
  tema(); tabBar();
  if(tok())avvia(false); else pagina('set');
})();
if('serviceWorker' in navigator&&/^https:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
